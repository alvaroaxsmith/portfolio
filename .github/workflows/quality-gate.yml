name: Quality gate

# Job ids are the required status checks on main (lint, unit, build, e2e, visual). Renaming a job blocks every merge.
# Runs on pull requests only: the run tests the PR merged into main, and main requires the PR to be up to date
# before merging, so running again on the push to main would repeat the same work.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Dispatched by the release workflow on its release PR, which the workflow token cannot trigger otherwise.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  lint:
    # Drafts are work in progress; the gate runs when the PR is marked ready. A skipped job counts as passed,
    # and a draft cannot be merged anyway.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx ng lint

  unit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fails if any spec fails or coverage drops below the floor in karma.conf.js.
      - run: npx ng test --watch=false --code-coverage --browsers=ChromeHeadlessCI
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx ng build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      # Smoke, accessibility (axe) and keyboard specs.
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual:
    needs: build
    runs-on: ubuntu-latest
    # Same image (and version) as `npm run test:visual`, so fonts render pixel for pixel like the references.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      VISUAL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # Holds expected, actual and diff images for every screen that changed.
          name: visual-diff
          path: test-results/
          retention-days: 14
