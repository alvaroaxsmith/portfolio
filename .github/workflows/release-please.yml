name: Release

# On every merge to main, release-please opens or updates a release PR with the next version (package.json,
# CHANGELOG.md). Merging that PR creates the tag and a draft GitHub Release; the owner publishes it after the
# notes are rewritten for visitors. See CLAUDE.md for which commit types bump which part of the version.
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Approves the quality gate runs of the release PR (see the last step).
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR is opened by github-actions[bot], which GitHub treats as a first-time contributor: its
      # pull_request runs wait in "action_required" and the required checks never report on the PR. Approve
      # those runs (a gate dispatched by hand reports on the commit, not on the PR, so it does not unblock it).
      # The PR is parsed in the shell: step env is evaluated even when `if` is false, and fromJSON of the
      # empty `pr` output (no PR touched, e.g. right after a release) fails the job.
      - if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r .headBranchName <<< "$PR")
          for attempt in $(seq 1 12); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&event=pull_request&status=action_required" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/quality-gate.yml") | .id')
            [ -n "$runs" ] && break
            sleep 5
          done
          [ -z "$runs" ] && { echo "No pull_request run waiting for approval on $branch"; exit 0; }
          for id in $runs; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" \
              || echo "::warning::Could not approve run $id; approve it in the release PR (Approve and run workflows)."
          done
