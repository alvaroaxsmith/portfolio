name: "CodeQL"

# Security analysis of the TypeScript/JavaScript code. On main it keeps the baseline that PR results are compared
# with; the weekly run picks up new queries even when nothing is merged. Not a required check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Markdown changes no analysed code.
    paths-ignore: ['**/*.md']
  schedule:
    - cron: '18 1 * * 4'

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # JavaScript is analysed from source, so there is no build step (autobuild does nothing for it).
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4
