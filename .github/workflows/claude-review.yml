name: Claude review

# Reviews a PR once when it is opened or marked ready. Ask "@claude review" on the PR for another pass.
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # Dependabot and fork PRs get no secrets; drafts are reviewed when they become ready.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the rules in CLAUDE.md and the issue it closes.
            Report only real problems, each with the concrete case that breaks:
            - correctness bugs and broken production behaviour;
            - changes to the resting visual that the issue does not list as an approved exception;
            - accessibility regressions (name, role, state, focus, keyboard) against WCAG 2.2 AA;
            - i18n keys missing from EN.json or PT-BR.json;
            - fixes without a test that would fail before the change;
            - checklist items or acceptance criteria of the closed issue left undone.

            Post each problem as an inline comment on the line. Finish with one PR comment summarising
            the verdict (ready for human review, or the list of blockers). Do not push changes.
          claude_args: >-
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment *),Bash(gh pr diff *),Bash(gh pr view *),Bash(gh issue view *)"
