<section>
  <h1>{{ 'Welcome to my website' | translate }}</h1>
  @if (isLoadingImage) {
    <figure class="spinner">
      <mat-spinner diameter="80"></mat-spinner>
    </figure>
  } @else {
    <figure>
      <div class="sleeve">
        <img [src]="imageUrl" alt="Alvaro Ferreira" loading="lazy">
      </div>
    </figure>
  }
  <h2>{{ 'Hi, I’m' | translate }} <span class="highlight">{{ 'Alvaro Ferreira' }}</span></h2>
  <h3><app-text></app-text></h3>
</section>
<app-footer></app-footer>
