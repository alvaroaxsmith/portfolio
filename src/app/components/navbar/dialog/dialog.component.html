<section class="sheet" aria-label="Menu mobile">
    <div class="sheet-header">
        <p>{{ "Navigation" | translate }}</p>
        <button mat-icon-button type="button" (click)="dismiss()" aria-label="Fechar menu">
      <mat-icon>close</mat-icon>
    </button>
    </div>

    <ul>
        <li>
            <a routerLink="/" mat-button (click)="dismiss()">{{ "HOME" | translate }}</a>
        </li>
        <li>
            <a routerLink="/about-me" mat-button (click)="dismiss()">{{ "ABOUT ME" | translate }}</a>
        </li>
        <li>
            <a routerLink="/courses" mat-button (click)="dismiss()">{{ "COURSES" | translate }}</a>
        </li>
        <li>
            <a routerLink="/portfolio" mat-button (click)="dismiss()">{{ "PROJECTS" | translate }}</a>
        </li>
        <li>
            <a routerLink="/contact" mat-button (click)="dismiss()">{{ "CONTACT" | translate }}</a>
        </li>
    </ul>

    <div class="sheet-actions">
        <span>{{ "Language" | translate }}</span>
        <div class="language-buttons">
            @for (lang of translate.getLangs(); track trackByLang($index, lang)) {
            <button mat-stroked-button type="button" (click)="switchLang(lang)">
          {{ lang }}
        </button> }
        </div>
    </div>
</section>
