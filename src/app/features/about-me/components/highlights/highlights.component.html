<div class="highlights-container">

</div>

<div class="section-heading">
    <p class="eyebrow">{{ "highlights.eyebrow" | translate }}</p>
    <p class="section-copy">{{ "highlights.intro" | translate }}</p>
</div>

<div class="timeline" #timeline>
    @for (highlight of highlights; track highlight) {
    <div class="timeline-item" #timelineItem>
        <div class="timeline-content">
            <h4>
                {{ highlight.date | translate }} @if (highlight.dateRange) {
                <span> {{ highlight.dateRange | translate }}</span> }
            </h4>
            <p>{{ highlight.description | translate }}</p>
        </div>
    </div>
    }
</div>
