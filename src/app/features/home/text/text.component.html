<div class="word-window">
  <div class="rotating-word" [class.shown]="animationState() === 'shown'">
    {{ words[currentIndex()] | translate }}
  </div>
</div>
<button type="button" class="rotation-toggle" [attr.aria-label]="'home.rotation.pause' | translate" [attr.aria-pressed]="pinned()">
  <mat-icon aria-hidden="true">{{ pinned() ? 'play_arrow' : 'pause' }}</mat-icon>
</button>
