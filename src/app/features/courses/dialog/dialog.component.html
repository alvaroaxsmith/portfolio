<section class="sheet" aria-labelledby="certificate-title">
  <span class="handle" aria-hidden="true"></span>

  <header class="sheet-header">
    <div class="heading">
      <h2 id="certificate-title">{{ rowData.name }}</h2>
      @if (rowData.school || rowData.date) {
        <p class="meta">
          {{ rowData.school }}
          @if (rowData.school && rowData.date) { <span aria-hidden="true">·</span> }
          {{ rowData.date }}
        </p>
      }
    </div>

    <div class="actions">
      @if (externalUrl) {
        <a mat-icon-button [href]="externalUrl" target="_blank" rel="noopener noreferrer" (click)="trackOpenNewTab()"
          [attr.aria-label]="'certificate.openNewTab' | translate"
          [title]="'certificate.openNewTab' | translate">
          <mat-icon>open_in_new</mat-icon>
        </a>
      }
      <button mat-icon-button type="button" (click)="dismiss()"
        [attr.aria-label]="'certificate.close' | translate"
        [title]="'certificate.close' | translate">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </header>

  <div class="frame" [class.is-loaded]="isFrameLoaded">
    @if (!isFrameLoaded) {
      <app-skeleton class="frame-placeholder" radius="0" />
      <span class="sr-only" role="status">{{ 'certificate.loading' | translate }}</span>
    }
    @if (safeUrl) {
      <iframe [src]="safeUrl" [title]="rowData.name" allow="autoplay" (load)="onFrameLoad($event)"></iframe>
    }
  </div>
</section>
