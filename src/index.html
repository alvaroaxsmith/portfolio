<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <title>Alvaro Ferreira | Engenheiro de Software</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Portfólio de Alvaro Ferreira, engenheiro de software com foco em frontend, aplicações full stack, acessibilidade, performance e experiências digitais responsivas." />
    <meta name="keywords" content="Alvaro Ferreira, engenheiro de software, desenvolvedor frontend, desenvolvedor full stack, Angular, React, acessibilidade, SEO, portfólio" />
    <meta name="author" content="Alvaro Ferreira" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alvaro Ferreira | Engenheiro de Software" />
    <meta property="og:description" content="Projetos, trajetória profissional e formas de contato em um portfólio com foco em produto, frontend e experiências digitais acessíveis." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alvaro Ferreira | Engenheiro de Software" />
    <meta name="twitter:description" content="Portfólio com foco em frontend, full stack, acessibilidade, SEO e design responsivo." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <style>
        /* Splash: o canvas da grade nasce aqui, antes do JavaScript do app. O
           Angular (SplashScreenComponent) adota a grade, põe o texto traduzido e
           comanda a saída. O fundo é transparente: ao fim da dissolução o que
           sobra é o próprio fundo do body */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 10000;
            /* Até o primeiro quadro do canvas */
            background: #52525b;
        }

        #splash.is-drawn {
            background: transparent;
        }

        /* Sem barra de rolagem enquanto a splash cobre a tela */
        html.splash-active,
        html.splash-active body {
            overflow: hidden !important;
        }

        #splash canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- Splash: grade em canvas, adotada depois pelo SplashScreenComponent -->
    <div id="splash" aria-hidden="true"><canvas id="splash-canvas"></canvas></div>

    <app-root></app-root>

    <script>
        // Motor da splash. Desenha a grade de 24px do fundo do site em canvas:
        // cada quadrado cintila num tom ardósia próprio e a paleta inteira clareia
        // com o tempo. O Angular chama window.__splash.finish() para a saída, em
        // que os quadrados se dissolvem em ordem aleatória e revelam o fundo do site.
        (function () {
            var root = document.getElementById("splash");
            document.documentElement.classList.add("splash-active");
            var canvas = document.getElementById("splash-canvas");
            var ctx = canvas.getContext("2d");
            var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            var CELL = 24;
            // Clareamento: vai a 70% em 3s e segura ali até o app ficar pronto
            var LIGHT_TARGET = 0.7;
            var LIGHT_DURATION = 3000;
            var EXIT_MS = 500;
            // Na saída, cada quadrado some em 150ms, começando num instante
            // aleatório dentro da janela da saída
            var CELL_FADE_MS = 150;
            // Se o app nunca chamar finish (falha de carregamento), sai sozinha
            var SAFETY_MS = 8000;

            // Cinzas neutros (família zinc), sem o tom azulado da ardósia, até o
            // fundo do site (#f3f6fb) para a saída terminar na cor da página.
            // Interpolada em 48 degraus para o cintilar não andar aos saltos
            var STOPS = ["#18181b", "#27272a", "#3f3f46", "#52525b", "#71717a", "#a1a1aa", "#d4d4d8", "#e4e4e7", "#f3f6fb"];
            var TONES = 48;
            // Largura da faixa de tons em que os quadrados cintilam
            var WINDOW = 18;
            // Tom mais escuro que um quadrado pode ter: a grade nunca chega perto
            // do tom do texto "Carregando" (#0f172a), reservado só para ele
            var MIN_TONE = 16;
            var palette = buildPalette();

            var startedAt = performance.now();
            var cols = 0, rows = 0, cells = [];
            var finishStart = 0, finishResolve = null, finished = false;
            var frame = 0;

            function hexToRgb(hex) {
                var n = parseInt(hex.slice(1), 16);
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            }

            function buildPalette() {
                var rgb = STOPS.map(hexToRgb), out = [];
                for (var i = 0; i < TONES; i++) {
                    var p = i / (TONES - 1) * (rgb.length - 1);
                    var k = Math.min(rgb.length - 2, Math.floor(p)), f = p - k;
                    out.push(rgb[k].map(function (c, j) { return Math.round(c + (rgb[k + 1][j] - c) * f); }));
                }
                return out;
            }

            function color(tone, alpha) {
                var c = palette[Math.max(0, Math.min(TONES - 1, Math.round(tone)))];
                return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + alpha + ")";
            }

            function resize() {
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var w = window.innerWidth, h = window.innerHeight;
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                var c = Math.ceil(w / CELL), r = Math.ceil(h / CELL);
                if (c === cols && r === rows) return;
                cols = c; rows = r; cells = [];
                for (var i = 0; i < cols * rows; i++) {
                    var start = Math.random() * WINDOW;
                    cells.push({
                        tone: start,
                        target: start,
                        rate: 0.04 + Math.random() * 0.1,
                        next: Math.random() * 600,
                        exitDelay: Math.random() * (EXIT_MS - CELL_FADE_MS)
                    });
                }
            }

            function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

            function lightAt(elapsed) {
                return LIGHT_TARGET * easeOut(Math.min(1, elapsed / LIGHT_DURATION));
            }

            function draw(now) {
                var elapsed = now - startedAt;
                var light = reducedMotion ? 0 : lightAt(elapsed);
                // Faixa de tons sobe com o clareamento, sempre acima de MIN_TONE
                var base = MIN_TONE + light * (TONES - 1 - WINDOW - MIN_TONE);
                var exitElapsed = finishStart ? now - finishStart : 0;

                ctx.clearRect(0, 0, cols * CELL, rows * CELL);
                var allGone = !!finishStart;

                for (var y = 0; y < rows; y++) {
                    for (var x = 0; x < cols; x++) {
                        var cell = cells[y * cols + x];
                        var alpha = 1;

                        if (finishStart) {
                            alpha = reducedMotion
                                ? 1 - Math.min(1, exitElapsed / EXIT_MS)
                                : 1 - Math.min(1, Math.max(0, (exitElapsed - cell.exitDelay) / CELL_FADE_MS));
                            if (alpha <= 0) continue;
                            allGone = false;
                        }

                        if (!reducedMotion) {
                            if (now >= cell.next) {
                                cell.target = Math.random() * WINDOW;
                                cell.next = now + 250 + Math.random() * 1100;
                            }
                            cell.tone += (cell.target - cell.tone) * cell.rate;
                        }

                        var tone = base + cell.tone;
                        var px = x * CELL, py = y * CELL;
                        // Linha da grade (1px no topo e à esquerda, como no body) um
                        // degrau mais escura que o quadrado
                        ctx.fillStyle = color(tone - 6, alpha);
                        ctx.fillRect(px, py, CELL, CELL);
                        ctx.fillStyle = color(tone, alpha);
                        ctx.fillRect(px + 1, py + 1, CELL - 1, CELL - 1);
                    }
                }

                if (frame === 0) root.classList.add("is-drawn");
                frame++;

                if (allGone) {
                    finished = true;
                    root.remove();
                    document.documentElement.classList.remove("splash-active");
                    window.removeEventListener("resize", onResize);
                    if (finishResolve) finishResolve();
                    return;
                }
                // Com movimento reduzido a grade é estática: só redesenha na saída
                if (!reducedMotion || finishStart) requestAnimationFrame(draw);
            }

            var resizeTimer;
            function onResize() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () {
                    resize();
                    if (reducedMotion && !finishStart) draw(performance.now());
                }, 120);
            }

            function finish() {
                if (finished) return Promise.resolve();
                return new Promise(function (resolve) {
                    finishResolve = resolve;
                    if (!finishStart) {
                        finishStart = performance.now();
                        if (reducedMotion) requestAnimationFrame(draw);
                    }
                });
            }

            resize();
            // Primeiro quadro síncrono: a grade já aparece no primeiro paint
            draw(performance.now());
            window.addEventListener("resize", onResize);
            setTimeout(finish, SAFETY_MS);

            window.__splash = {
                startedAt: startedAt,
                root: root,
                finish: finish
            };
        })();
    </script>
</body>

</html>
